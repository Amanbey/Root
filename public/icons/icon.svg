<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011812"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for squircle/app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Subtle grid/constellation representing AI multi-agent connectivity -->
  <circle cx="156" cy="190" r="4" fill="#6ee7b7" opacity="0.4"/>
  <circle cx="356" cy="190" r="4" fill="#6ee7b7" opacity="0.4"/>
  <circle cx="256" cy="110" r="6" fill="#fde047" opacity="0.6"/>
  <path d="M156 190 L256 110 L356 190" stroke="#34d399" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Left Sprout Leaf -->
  <path d="M256 260 C210 210 160 210 145 250 C130 290 170 320 256 300 Z" fill="url(#leafGrad)" filter="url(#glow)"/>

  <!-- Right Sprout Leaf -->
  <path d="M256 260 C302 200 360 205 372 242 C384 280 340 312 256 300 Z" fill="url(#leafGrad)"/>

  <!-- Central Emerging Golden Grain / Shoot -->
  <path d="M256 120 C246 160 248 210 256 280 C264 210 266 160 256 120 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Central Stem -->
  <path d="M256 260 L256 360" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>

  <!-- Roots System (Representing Offline Foundation & Deep Community Knowledge) -->
  <path d="M256 360 C240 385 200 405 160 415" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="160" cy="415" r="5" fill="#fde047"/>

  <path d="M256 370 C270 395 315 410 352 420" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="352" cy="420" r="5" fill="#fde047"/>

  <path d="M256 360 L256 430" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="430" r="6" fill="#34d399"/>

  <path d="M230 380 C210 400 185 410 170 435" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M280 385 C305 405 325 425 340 445" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
